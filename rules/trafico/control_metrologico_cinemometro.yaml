    fundamento: RDL 6/2015, arts. 76.a y 77.a
  - id: medida_con_instrumento
    descripcion: La velocidad se midió con un cinemómetro.
    fundamento: RDL 6/2015, art. 83.2
  - id: control_metrologico_no_acreditado
    descripcion: >-
      Ni la denuncia ni el expediente acreditan el control metrológico del cinemómetro. Si
      consta, el resultado es «dudoso»: ggLaw no puede valorar si estaba vigente.
    fundamento: RDL 6/2015, art. 83.2
datos_necesarios: [infraccion_velocidad, medida_con_cinemometro, consta_control_metrologico]
parametros: {}
parrafo_tipo: null             # pendiente (tarea 6)
notas: |
  Alcance limitado a pedir que se acredite el control metrológico (art. 83.2) y proponer la
  prueba (art. 95.1). El escrito no debe afirmar que el aparato no estaba verificado, solo
  que no consta.

